<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
	<title id="title">Z-Push architecture</title>
	<desc id="desc">ActiveSync clients (iOS, Windows, Android, Mail, BlackBerry 10) connect to the frontend: a webserver (apache2, nginx or lighttpd) running PHP (mod_php or php-fpm) with PHP-MAPI. Z-Push sits between the frontend and the backend, where the differential engine serves the Zarafa, MailDir, vCard and IMAP backends or your own application.</desc>
	<defs>
		<filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
			<feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/>
		</filter>
		<linearGradient id="zpush" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#1f7a83"/>
			<stop offset="1" stop-color="#2b9aa5"/>
		</linearGradient>
		<marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
			<path d="M0 0 10 5 0 10z" fill="#7ebec5"/>
		</marker>
		<g id="phone" fill="none" stroke="#1f7a83" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
			<rect x="-9" y="-15" width="18" height="30" rx="3.5"/>
			<path d="M-3 10h6"/>
		</g>
		<g id="monitor" fill="none" stroke="#1f7a83" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
			<rect x="-15" y="-12" width="30" height="20" rx="2.5"/>
			<path d="M-6 14h12M0 8v6"/>
		</g>
		<g id="server" fill="none" stroke="#1f7a83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
			<rect x="-22" y="-24" width="44" height="20" rx="4"/>
			<rect x="-22" y="4" width="44" height="20" rx="4"/>
			<path d="M-13 -14h0M-13 14h0"/>
		</g>
		<g id="envelope" fill="none" stroke="#1f7a83" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
			<rect x="-15" y="-10" width="30" height="20" rx="2.5"/>
			<path d="m-14 -8 14 10 14 -10"/>
		</g>
	</defs>

	<style>
		.panel { fill: #f5f9fa; stroke: #dce9ec; }
		.layer { fill: #6b7280; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
		.box { fill: #ffffff; stroke: #cfe2e5; }
		.box-strong { fill: #e7f3f5; stroke: #b9d9de; }
		.label { fill: #111827; font-size: 19px; font-weight: 500; }
		.label-sm { fill: #111827; font-size: 17px; font-weight: 500; }
		.muted { fill: #6b7280; font-size: 15px; }
	</style>

	<!-- Backend -->
	<rect class="panel" x="20" y="20" width="1160" height="262" rx="18"/>
	<text class="layer" x="48" y="54">BACKEND</text>

	<g filter="url(#shadow)">
		<rect class="box-strong" x="48" y="74" width="184" height="180" rx="12"/>
		<rect class="box" x="252" y="74" width="214" height="78" rx="12"/>
		<rect class="box" x="482" y="74" width="214" height="78" rx="12"/>
		<rect class="box" x="712" y="74" width="214" height="78" rx="12"/>
		<rect class="box" x="942" y="74" width="210" height="78" rx="12" stroke-dasharray="6 5"/>
		<rect class="box-strong" x="252" y="168" width="900" height="86" rx="12"/>
	</g>
	<text text-anchor="middle">
		<tspan class="label" x="140" y="196">Zarafa</tspan>
		<tspan class="label" x="359" y="108">MailDir</tspan><tspan class="muted" x="359" y="132">Backend</tspan>
		<tspan class="label" x="589" y="108">vCard</tspan><tspan class="muted" x="589" y="132">Backend</tspan>
		<tspan class="label" x="819" y="108">IMAP</tspan><tspan class="muted" x="819" y="132">Backend</tspan>
		<tspan class="label" x="1047" y="108">Your</tspan><tspan class="muted" x="1047" y="132">Application</tspan>
		<tspan class="label" x="702" y="218">Differential Engine</tspan>
	</text>

	<use href="#server" x="140" y="140"/>

	<!-- Z-Push -->
	<g filter="url(#shadow)">
		<rect x="20" y="302" width="1160" height="68" rx="14" fill="url(#zpush)"/>
	</g>
	<text x="600" y="345" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="0.02em">Z-Push</text>

	<!-- Frontend -->
	<rect class="panel" x="20" y="390" width="1160" height="210" rx="18"/>
	<text class="layer" x="48" y="424">FRONTEND</text>

	<g filter="url(#shadow)">
		<rect class="box" x="48" y="444" width="200" height="62" rx="12"/>
		<rect class="box" x="264" y="444" width="888" height="62" rx="12"/>
		<rect class="box-strong" x="48" y="520" width="1104" height="62" rx="12"/>
	</g>
	<text text-anchor="middle">
		<tspan class="label-sm" x="148" y="481">PHP-MAPI</tspan>
		<tspan class="label-sm" x="708" y="481">PHP (mod_php / php-fpm)</tspan>
		<tspan class="label-sm" x="600" y="557">Webserver (apache2 / nginx / lighttpd)</tspan>
	</text>

	<!-- Requests from clients -->
	<g stroke="#7ebec5" stroke-width="3" stroke-linecap="round" marker-end="url(#head)">
		<path d="M155 668V618"/>
		<path d="M333 668V618"/>
		<path d="M511 668V618"/>
		<path d="M689 668V618"/>
		<path d="M867 668V618"/>
		<path d="M1045 668V618"/>
	</g>

	<!-- ActiveSync clients -->
	<rect class="panel" x="20" y="684" width="1160" height="156" rx="18"/>
	<text class="layer" x="48" y="718">ACTIVESYNC CLIENTS</text>

	<g filter="url(#shadow)">
		<rect class="box" x="48" y="738" width="206" height="76" rx="12"/>
		<rect class="box" x="272" y="738" width="206" height="76" rx="12"/>
		<rect class="box" x="496" y="738" width="206" height="76" rx="12"/>
		<rect class="box" x="720" y="738" width="206" height="76" rx="12"/>
		<rect class="box" x="944" y="738" width="208" height="76" rx="12"/>
	</g>
	<use href="#phone" x="96" y="776"/>
	<use href="#monitor" x="320" y="776"/>
	<use href="#phone" x="544" y="776"/>
	<use href="#envelope" x="768" y="776"/>
	<use href="#phone" x="992" y="776"/>
	<g class="label-sm">
		<text x="124" y="782">iOS</text>
		<text x="348" y="782">Windows</text>
		<text x="572" y="782">Android</text>
		<text x="796" y="782">Mail</text>
		<text x="1020" y="782">BlackBerry 10</text>
	</g>
</svg>
