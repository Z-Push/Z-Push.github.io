{%- for post in include.posts %}
<article class="entry entry--summary">
	{% include post-meta.html post=post %}
	<h2 class="entry-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
	<p>{{ post.summary | default: post.content | strip_html | normalize_whitespace | truncatewords: 30, "…" }}</p>
	<a class="read-more" href="{{ post.url | relative_url }}" aria-label="Read {{ post.title | escape }}">Read more <span aria-hidden="true">&rarr;</span></a>
</article>
{%- endfor %}
