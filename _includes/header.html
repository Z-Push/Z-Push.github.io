<header class="site-header">
	<div class="container">
		<a class="site-logo" href="{{ '/' | relative_url }}">
			<img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" width="164" height="45">
		</a>
		<nav class="site-nav" aria-label="Main">
			<ul>
				{%- for item in site.navigation %}
				<li{% if page.url == item.url %} class="current"{% endif %}><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
				{%- endfor %}
			</ul>
		</nav>
		<button class="icon-button search-toggle" type="button" aria-label="Search" aria-expanded="false">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M15.5 15.5 22 22"/></svg>
		</button>
		<button class="icon-button menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
		</button>
	</div>
	<div class="search-bar">
		<form class="container" role="search" method="get" action="{{ site.search.action | default: 'https://duckduckgo.com/' }}">
			{%- assign search_site = site.search.site | default: site.url | remove: 'https://' | remove: 'http://' %}
			<input type="hidden" name="sites" value="{{ search_site }}">
			<label class="screen-reader-text" for="search-field">Search for:</label>
			<input id="search-field" type="search" name="q" placeholder="Search &hellip;">
			<button class="icon-button search-close" type="button" aria-label="Close search">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>
			</button>
		</form>
	</div>
</header>
